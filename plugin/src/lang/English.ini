需要管理员权限 = "Administrator privileges required"
创建原始套接字被拒绝（WSAError 10013）。本插件通过原始套接字抓取数据包，需要管理员权限。\n解决方法：右键 TrafficMonitor → 以管理员身份运行。\n若已是管理员运行，请检查火绒/360 等安全软件是否拦截原始套接字。 = "Raw socket creation was denied (WSAError 10013). This plugin captures packets via raw sockets and needs administrator privileges.\nSolution: right-click TrafficMonitor → Run as administrator.\nIf already running as admin, check whether security software (e.g. Huorong/360) is blocking raw sockets."
套接字创建失败 = "Socket creation failed"
创建原始套接字失败（WSAError %d）。请尝试以管理员身份运行 TrafficMonitor，或检查安全软件设置。 = "Failed to create raw socket (WSAError %d). Try running TrafficMonitor as administrator, or check your security software settings."
绑定网卡失败 = "Failed to bind network adapter"
绑定网卡 IP 失败（WSAError %d）。网卡 IP 可能已变化，插件将自动重试。 = "Failed to bind adapter IP (WSAError %d). The adapter IP may have changed; the plugin will retry automatically."
抓包被拒绝 = "Packet capture denied"
开启抓包模式失败（SIO_RCVALL，WSAError %d）。通常是权限不足或被安全软件拦截。\n解决方法：右键 TrafficMonitor → 以管理员身份运行。 = "Failed to enable capture mode (SIO_RCVALL, WSAError %d). Usually caused by insufficient privileges or security software blocking.\nSolution: right-click TrafficMonitor → Run as administrator."
抓包启动失败 = "Capture startup failed"
无法创建任何抓包套接字。请尝试以管理员身份运行 TrafficMonitor。 = "Could not create any capture sockets. Try running TrafficMonitor as administrator."
